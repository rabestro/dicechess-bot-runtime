name: CD

# push: tags fires for a tag pushed with real user credentials (e.g. a human pushing from their
# own machine) — GitHub does not fire this trigger for a tag pushed by another workflow using the
# default GITHUB_TOKEN (documented anti-recursion behavior), which is why release.yml publishes
# inline instead of depending on this. workflow_dispatch is the manual recovery path: pick the
# existing tag as the ref to re-run a publish that release.yml missed before that fix landed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server-username/server-password/gpg-passphrase are NAMES of env vars, not the secret
      # values themselves — setup-java writes them into ~/.m2/settings.xml as ${env.VARNAME}
      # placeholders, which Maven resolves at runtime from whatever step's environment actually
      # runs the deploy. gpg-private-key is the one literal secret here: it is imported into a
      # fresh keyring during this step.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        run: mvn --batch-mode versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Run tests
        run: mvn --batch-mode test

      # -P release activates signing (maven-gpg-plugin) and the Central Portal upload
      # (central-publishing-maven-plugin) — see release.yml and pom.xml for the full rationale.
      - name: Publish
        run: mvn --batch-mode -P release deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
